    <!-- helmet: dome, long neck guard at the back, nose guard and cheek guard at the front; the eye is cut out -->
    <path fill-rule="evenodd" d="
      M64 204 C78 186 76 160 74 140 C70 100 98 76 136 76 C168 76 190 98 190 128 L190 150 Q190 158 182 160
      L176 161 L182 196 Q166 204 150 198 L144 170 Q138 164 130 170 L126 200 Q96 212 64 204 Z
      M148 118 Q166 108 184 116 L184 132 Q166 138 150 132 Z"/>
  </g>
</svg>
