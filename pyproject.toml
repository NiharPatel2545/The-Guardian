[project]
name = "the-guardian"
version = "0.4.0"
description = "A guard for AI agents: policy rules plus a prompt-injection detector, answering allow / block / ask."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nihar Patel" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["prompt injection", "ai security", "agents", "guardrails", "llm"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security", "Intended Audience :: Developers"]

[project.optional-dependencies]
model = ["torch", "transformers>=4.48", "huggingface_hub"]

[project.urls]
Homepage = "https://github.com/NiharPatel2545/The-Guardian"
Model = "https://huggingface.co/niharpatel2545/guardian-v4"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["guardian"]
